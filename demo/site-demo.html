var RATIOS = [1.32, 1.0, 1.5, 1.2, 0.82, 1.42, 1.1, 1.25];

/* ---------- State ---------- */
var favs = [];

var filter = { place: "", area: "", q: "" };

var HEART = '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.2-4.4-9.2-8.9C1.4 8.4 3.4 4.8 6.9 4.8c2.1 0 3.4 1.1 4.1 2.3h2c.7-1.2 2-2.3 4.1-2.3 3.5 0 5.5 3.6 4.1 6.8-2 4.5-9.2 8.9-9.2 8.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
var PIN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function heartBtn(b, extra) {

  return '<button type="button" class="heart ' + (extra || "") + '" data-fav="' + b.id + '" aria-pressed="' + on + '" aria-label="' + (on ? "הסרה מהמועדפים: " : "הוספה למועדפים: ") + esc(b.name) + '">' + HEART + "</button>";

}
function updateFavCount() { $("#favCount").textContent = favs.length; }

/* ---------- Views ---------- */
var app = $("#app");
function places() { var s = []; B.forEach(function (b) { if (s.indexOf(b.city) < 0) s.push(b.city); }); return s; }

function matches(b) {

}
function chipRow(label, list, key, cls) {

}
function renderHome() {

    '<div class="intro"><h1>העסקים הקטנים של רמת הנגב</h1><p>יקבים, צימרים, סיורים, מאפיות וסטודיואים של אנשים שגרים כאן. סמנו לב על מה שאהבתם ותמצאו אותו אחר כך במועדפים.</p></div>' +

    "</div>";
}

    (list.length ? '<div class="grid">' + list.map(function (b) { return card(b, B.indexOf(b)); }).join("") + "</div>"
      : '<div class="empty"><h2>עוד אין מועדפים</h2><p>לחצו על הלב שעל תמונה של עסק כדי לשמור אותו כאן.</p><a class="btn primary" href="#">לגלות עסקים</a></div>') +
    "</div>";
}
function openNow(b) {
  if (!b.hours) return null;
  var now = new Date(), d = b.hours[now.getDay()];

  if (m >= toM(d[0]) && m < toM(d[1])) return { open: true, text: "פתוח עכשיו, עד " + d[1] };
  return { open: false, text: m < toM(d[0]) ? "ייפתח היום ב-" + d[0] : "סגור עכשיו" };
}
function intlPhone(p) { return "972" + p.replace(/\D/g, "").replace(/^0/, ""); }

}
var ICON_PHONE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>';

var gallerySet = [];
function renderSite(b) {

  gallerySet = [photo(b, "g1", 1200, 900), photo(b, "g2", 800, 600), photo(b, "g3", 800, 600), photo(b, "g4", 800, 600), photo(b, "g5", 800, 600)];

        return '<article class="product"><img alt="" src="' + photo(b, "p" + i, 480, 360) + '"><div><h3>' + esc(p[0]) + "</h3><p>" + esc(p[1]) + '</p><div class="pm"><span class="price">₪' + esc(p[2]) + "</span>" + (p[3] ? "<span>" + esc(p[3]) + "</span>" : "") + "</div></div></article>";

function route() {

  document.title = "מקומי רמת הנגב";

    var b = B.filter(function (x) { return x.id === h.slice(2); })[0];
    if (b) { renderSite(b); window.scrollTo(0, 0); return; }
  }

function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }

}
document.addEventListener("click", function (e) {
  var fav = e.target.closest("[data-fav]");

});

  filter.q = e.target.value;

});
window.addEventListener("hashchange", route);
