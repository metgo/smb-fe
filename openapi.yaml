openapi: 3.0.0
paths:
  /admin/map-point:
    post:
      operationId: createMapPoint
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMapPointDto"
      responses:
        "200":
          description: Map Point was successfully created
        "422":
          description: Failed Validation
      tags:
        - Admin
    get:
      operationId: getAllMapPoint
      parameters: []
      responses:
        "200":
          description: ""
  /admin/map-point-Categories:
    post:
      operationId: createMapPointCategories
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMapPointCategoriesDto"
      responses:
        "201":
          description: ""
    get:
      operationId: getAllMapPointCategories
      parameters: []
      responses:
        "200":
          description: ""
  /admin/map-point-sub-Categories:
    post:
      operationId: createMapPointSubCategories
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMapPointSubCategoriesDto"
      responses:
        "201":
          description: ""
    get:
      operationId: getAllMapPointSubCategories
      parameters: []
      responses:
        "200":
          description: ""
  /admin/map-point-sub-Categories-items:
    post:
      operationId: createMapPointSubCategoriesItems
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMapPointSubCategoriesItemDto"
      responses:
        "201":
          description: ""
    get:
      operationId: getAllMapPointSubCategoriesItems
      parameters: []
      responses:
        "200":
          description: ""
  /business:
    post:
      operationId: createBusiness
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createBusinessDto"
      responses:
        "201":
          description: ""
    get:
      operationId: getAllBusiness
      parameters: []
      responses:
        "200":
          description: ""
  "/business/{id}":
    put:
      operationId: updateBusiness
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateBusinessDto"
      responses:
        "200":
          description: ""
  /users/me:
    get:
      operationId: me
      summary: Get My Information
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDetailsResponse"
      tags:
        - Users
  /users:
    post:
      operationId: createUser
      summary: Create new user
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDetailsResponse"
      tags:
        - Users
  "/users/{userId}":
    patch:
      operationId: updateUser
      summary: Update User's Information
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: ""
          content:
