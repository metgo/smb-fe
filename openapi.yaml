components:
  securitySchemes:
    defaultBearerAuth:
      scheme: bearer
      bearerFormat: JWT
      description: Default JWT Authorization
      type: http
      in: header
  schemas:
    SignInRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        fullName:
          type: string
        phone:
          type: string
      required:
        - email
        - password
        - fullName
        - phone
    GetUserDetailsResponse:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phoneDetails:
          type: object
        address:
          type: string
        email:
          type: string
        lastLogin:
          format: date-time
          type: string
        isPhoneVerify:
          type: boolean
        isEmailVerify:
          type: boolean
        loginAttempts:
          type: number
        role:
          type: string
        hasBusiness:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        deletedAt:
          format: date-time
          type: string
      required:
        - id
        - fullName
        - phoneDetails
        - address
        - email
        - lastLogin
        - isPhoneVerify
        - isEmailVerify
        - loginAttempts
        - role
        - hasBusiness
        - createdAt
        - updatedAt
        - deletedAt
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        countryCode:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        address:
          type: string
      required:
        - fullName
        - countryCode
        - phoneNumber
        - email
        - address
    createUserByAdminDto:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        countryCode:
          type: string
        phoneNumber:
          type: string
