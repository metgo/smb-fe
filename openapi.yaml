    delete:
      operationId: softDeleteUser
      summary: Delete User's Information
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDetailsResponse"
      tags:
        - Users
info:
  title: METGO
  description: API Documentation for MetGo
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    createMapPointDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
      required:
        - name
    createMapPointCategoriesDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
        mapPointId:
          type: array
          items:
            type: string
      required:
        - name
        - mapPointId
    createMapPointSubCategoriesDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
        mapPointId:
          type: array
          items:
            type: string
        mapPointCategoriesId:
          type: array
          items:
            type: string
      required:
        - name
        - mapPointId
        - mapPointCategoriesId
    createMapPointSubCategoriesItemDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
        mapPointId:
          type: array
          items:
            type: string
        mapPointCategoriesId:
          type: array
          items:
            type: string
        mapPointSubCategoriesId:
          type: array
          items:
            type: string
      required:
        - name
        - mapPointId
        - mapPointCategoriesId
        - mapPointSubCategoriesId
    createBusinessDto:
      type: object
      properties: {}
    updateBusinessDto:
      type: object
      properties: {}
    GetUserDetailsResponse:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: number
        address:
          type: string
        email:
          type: string
        lastLogin:
          format: date-time
          type: string
        isPhoneVerify:
          type: boolean
        isEmailVerify:
          type: boolean
        loginAttempts:
          type: number
        role:
          type: string
        hasBusiness:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        deletedAt:
          format: date-time
          type: string
      required:
        - id
        - fullName
        - phone
        - address
        - email
        - lastLogin
        - isPhoneVerify
        - isEmailVerify
        - loginAttempts
        - role
        - hasBusiness
        - createdAt
        - updatedAt
        - deletedAt
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: number
        email:
          type: string
        address:
          type: string
      required:
        - fullName
        - phone
        - email
        - address
