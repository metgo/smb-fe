info:
  title: METGO
  description: API Documentation for MetGo
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    createMapPointDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
      required:
        - name
    updateMapPointDto:
      type: object
      properties: {}
    createMapPointCategoriesDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
        mapPointId:
          type: array
          items:
            type: string
      required:
        - name
        - mapPointId
    updateMapPointCategoriesDto:
      type: object
      properties: {}
    createMapPointSubCategoriesDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
        mapPointId:
          type: array
          items:
            type: string
        mapPointCategoriesId:
          type: array
          items:
            type: string
      required:
        - name
        - mapPointId
        - mapPointCategoriesId
    updateMapPointSubCategoriesDto:
      type: object
      properties: {}
    createMapPointSubCategoriesItemDto:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        pathAlt:
          type: string
        mapPointId:
          type: array
          items:
            type: string
        mapPointCategoriesId:
          type: array
          items:
            type: string
        mapPointSubCategoriesId:
          type: array
          items:
            type: string
      required:
        - name
        - mapPointId
        - mapPointCategoriesId
        - mapPointSubCategoriesId
    updateMapPointSubCategoriesItemDto:
      type: object
      properties: {}
    ContactDetails:
      type: object
      properties:
        name:
          type: string
          description: Name of contact person
        phone:
          type: string
          description: Phone numer of contact person
        address:
          type: string
          description: address of contact person
      required:
        - name
        - phone
        - address
    geoLocation:
      type: object
      properties:
        lat:
          type: string
          description: Latitide of map
        long:
          type: string
          description: longitude of map
      required:
        - lat
        - long
    images:
      type: object
      properties:
        image:
          type: string
          description: path of image
        caption:
          type: string
          description: caption of image
        alt:
          type: string
          description: Image alternative text
      required:
        - image
        - caption
        - alt
    socialMedia:
      type: object
      properties:
        name:
          type: string
          description: Name of social Media
        url:
          type: string
          description: url of social media
      required:
        - name
        - url
    OpeningHours:
      type: object
      properties:
        days:
          type: string
          description: Days of operation
        open:
          format: date-time
          type: string
          description: Opening time
        close:
          format: date-time
          type: string
          description: Closing time
        isHoliday:
          type: boolean
          description: Is it a holiday?
          default: false
      required:
        - days
        - open
        - close
        - isHoliday
    createBusinessDto:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phoneNumber:
          type: string
        busiEmail:
          type: string
        description:
          type: string
        contactDetails:
          $ref: "#/components/schemas/ContactDetails"
        collabrationUser:
          type: array
          items:
            type: string
        geoLocation:
          $ref: "#/components/schemas/geoLocation"
        images:
          $ref: "#/components/schemas/images"
        socialMedia:
          $ref: "#/components/schemas/socialMedia"
        mapPointId:
          type: array
          items:
            type: string
        mapPointCategoriesId:
          type: array
          items:
            type: string
        mapPointSubCategoriesId:
          type: array
          items:
            type: string
        openingHrs:
          $ref: "#/components/schemas/OpeningHours"
      required:
        - name
        - address
        - phoneNumber
        - busiEmail
        - description
    updateBusinessDto:
      type: object
      properties: {}
    GetUserDetailsResponse:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: number
        address:
          type: string
        email:
          type: string
        lastLogin:
          format: date-time
          type: string
        isPhoneVerify:
          type: boolean
        isEmailVerify:
          type: boolean
        loginAttempts:
          type: number
        role:
          type: string
        hasBusiness:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        deletedAt:
          format: date-time
          type: string
      required:
        - id
        - fullName
        - phone
        - address
        - email
        - lastLogin
        - isPhoneVerify
        - isEmailVerify
        - loginAttempts
        - role
        - hasBusiness
        - createdAt
        - updatedAt
        - deletedAt
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: number
        email:
          type: string
        address:
          type: string
      required:
        - fullName
        - phone
        - email
        - address
