openapi: 3.0.0
paths:
  /users/me:
    get:
      operationId: me
      summary: Get My Information
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDetailsResponse"
      tags:
        - Users
  /users:
    post:
      operationId: createUser
      summary: Create new user
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDetailsResponse"
      tags:
        - Users
  "/users/{userId}":
    patch:
      operationId: updateUser
      summary: Update User's Information
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDetailsResponse"
      tags:
        - Users
    delete:
      operationId: softDeleteUser
      summary: Delete User's Information
      parameters:
        - name: userId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserDetailsResponse"
      tags:
        - Users
info:
  title: METGO
  description: API Documentation for MetGo
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  schemas:
    GetUserDetailsResponse:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        phone:
          type: number
        address:
          type: string
        email:
          type: string
        lastLogin:
          format: date-time
          type: string
        isPhoneVerify:
          type: boolean
        isEmailVerify:
          type: boolean
        loginAttempts:
          type: number
        role:
          type: string
        hasBusiness:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        deletedAt:
          format: date-time
          type: string
      required:
        - id
        - fullName
        - phone
        - address
        - email
        - lastLogin
        - isPhoneVerify
        - isEmailVerify
        - loginAttempts
        - role
        - hasBusiness
        - createdAt
        - updatedAt
        - deletedAt
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: number
        email:
          type: string
        address:
          type: string
      required:
        - fullName
        - phone
        - email
        - address
