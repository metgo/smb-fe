name: E2E test

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string

  pull_request:
    types: [opened, synchronize]

  push:
    branches:
      - main

env:
  NODE_VERSION: 16.20.1

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
            
      - name: Run install
        uses: borales/actions-yarn@v4
        with:
          cmd: install

      - name: Code Checkout
        uses: actions/checkout@v2
    
      - name: Install Node.js dependencies
        run: yarn

      - name: Generate local.env file
        run: cp local.env.example local.env
      
      - name: Set environment variables
        run: echo "DEV_CONFIG=local" >> $GITHUB_ENV

      - name: Run E2E Tests
        run: yarn test:e2e --forceExit
