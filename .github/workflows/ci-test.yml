name: E2E test

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string

  # pull_request:
  #   types: [opened, synchronize]

  # push:
  #   branches:
  #     - main

env:
  NODE_VERSION: 18.x

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Code Checkout
        uses: actions/checkout@v3
    
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
            
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate local.env file
        run: cp local.env.example local.env
      
      - name: Set environment variables
        run: echo "DEV_CONFIG=local" >> $GITHUB_ENV

      - name: Run E2E Tests
        run: yarn test:e2e --forceExit
        env:
          NODE_OPTIONS: --max-old-space-size=8192