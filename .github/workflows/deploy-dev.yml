name: Deploy to Docker Hub

on:
  push:
    branches:
      - main  # Trigger this workflow only on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3


      - name: Create GCS credentials file
        run: |
          mkdir -p credentials
          echo -n "${{ secrets.GCP_PATH }}" | base64 -d > credentials/metgo-staging-server-6d235c8ca059.json

        # Decode and create the .env file
      - name: Create .env file
        run: |
          echo -n "${{ secrets.ENV_FILE_DEV }}" | base64 -d > .env.development

      # Export environment variable and set configuration
      - name: Set environment variable
        run: echo "DEV_CONFIG=development" >> $GITHUB_ENV


      - name: Login to Docker Hub, Build and Push Docker Image
        run: |
          docker build \
            --build-arg ENV=development \
            --build-arg GCS_FILE_PATH=/app/credentials/metgo-staging-server-6d235c8ca059.json \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/metgo:develop
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/metgo:develop
          docker image prune -f
  
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH into the Ubuntu server and pull the Docker image
        uses: fifsky/ssh-action@master
        with:
          command: |
            # move to working directory
            cd external

            # Login to DockerHub to pull images
            sudo -S docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Pull docker image
            sudo docker-compose pull

            # Run docker-compose
            sudo docker-compose up -d web_staging

            #Removing dandling images
            sudo docker image prune -f

          host: ${{ secrets.SERVER_IP }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Cleanup sensitive files
        run: rm -rf credentials

