name: Deploy to Docker Hub

on:
  push:
    branches:
      - main  # Trigger this workflow only on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

        # Decode and create the .env file
      - name: Create .env file
        run: |
          echo -n "${{ secrets.ENV_FILE_DEV }}" | base64 -d > development.env

      # Log in to Docker Hub

      - name: Login to Docker Hub, Build and Push Docker Image
        env:
          DEV_CONFIG: development
        run: |
          export DEV_CONFIG=$DEV_CONFIG
          echo "Using DEV_CONFIG=${DEV_CONFIG}"

          docker build --build-arg="ENV=development" -t ${{ secrets.DOCKERHUB_USERNAME }}/metgo:develop .
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/metgo:develop
          docker image prune -f
  
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH into the Ubuntu server and pull the Docker image
        uses: fifsky/ssh-action@master
        with:
          command: |
            # move to working directory
            cd external

            # Login to DockerHub to pull images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Pull docker image
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker-compose pull

            # Run docker-compose
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker-compose up -d dev_metgo

            # Removing dangling images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker image prune -f

          host: ${{ secrets.SERVER_IP }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: "-T -o StrictHostKeyChecking=no"
      
      - name: Cleanup sensitive files
        run: rm -rf  .env.development

