name: Deploy to Docker Hub

on:
  push:
    branches:
      - main # Trigger this workflow only on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - name: tav8
            env_file: ENV_FILE_PROD
            tag: latest
            port: 3001
          - name: negev
            env_file: ENV_FILE_PROD_NEGEV
            tag: latest
            port: 3001

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file for ${{ matrix.app.name }}
        run: |
          echo -n "${{ secrets[matrix.app.env_file] }}" | base64 -d > .env.${{ matrix.app.name }}

      # Log in to Docker Hub

      - name: Docker login
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image for ${{ matrix.app.name }}
        run: |
          docker build \
            --build-arg ENV_FILE=.env.${{ matrix.app.name }} \
            --build-arg APP_PORT=${{ matrix.app.port }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.name }}:${{ matrix.app.tag }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.name }}:${{ matrix.app.tag }}
          docker image prune -f

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH into the Ubuntu server and pull the Docker image in TAV8
        uses: fifsky/ssh-action@master
        with:
          command: |
            # move to working directory
            cd external

            # Login to DockerHub to pull images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Pull docker image
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker-compose pull prod_tav8

            # Run docker-compose
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker-compose up -d prod_tav8

            # Removing dangling images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker image prune -f

          host: ${{ secrets.SERVER_PROD_IP }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: "-T -o StrictHostKeyChecking=no"

      - name: SSH into the Ubuntu server and pull the Docker image in NEGEV
        uses: fifsky/ssh-action@master
        with:
          command: |
            # move to working directory
            cd negev

            # Login to DockerHub to pull images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Pull docker image
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose pull prod_negev

            # Run docker-compose
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose up -d prod_negev

            # Removing dangling images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker image prune -f

          host: ${{ secrets.SERVER_PROD_IP_NEGEV }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: "-T -o StrictHostKeyChecking=no"
