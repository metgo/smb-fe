name: Deploy to Docker Hub

on:
  push:
    branches:
      - main  # Trigger this workflow only on pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove the GCS file and env
        run: rm -rf credentials .env.development
      
      - name: Create GCS credentials file
        run: |
          mkdir -p credentials
          echo -n "${{ secrets.GCP_PATH }}" | base64 -d > credentials/metgo-staging-server-6d235c8ca059.json

        # Decode and create the .env file
      - name: Create .env file
        run: |
          echo -n "${{ secrets.ENV_FILE_PROD }}" | base64 -d > production.env

      # Log in to Docker Hub

      - name: Login to Docker Hub, Build and Push Docker Image
        env:
          DEV_CONFIG: production
        run: |
          export DEV_CONFIG=$DEV_CONFIG
          echo "Using DEV_CONFIG=${DEV_CONFIG}"

          docker build --build-arg="ENV=production" -t ${{ secrets.DOCKERHUB_USERNAME }}/metgo:latest .
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/metgo:latest
          docker image prune -f
  
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH into the Ubuntu server and pull the Docker image
        uses: fifsky/ssh-action@master
        with:
          command: |
            # move to working directory
            cd external

            # Login to DockerHub to pull images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            # Pull docker image
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose pull

            # Run docker compose
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose up -d prod_metgo

            # Removing dangling images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker image prune -f

          host: ${{ secrets.SERVER_PROD_IP }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: "-T -o StrictHostKeyChecking=no"
      
      - name: Cleanup sensitive files
        run: rm -rf credentials .env.development

