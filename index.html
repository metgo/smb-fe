<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/metgologo.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef4444" />
    <meta name="description" content="Metgo management workspace" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Metgo" />
    <title>Metgo Workspace</title>
  </head>
  <body>
    <div id="root">
      <div
        id="splash-screen"
        style="
          position: fixed;
          inset: 0;
          z-index: 50;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(
            135deg,
            #facc15 0%,
            #ef4444 50%,
            #16a34a 100%
          );
        "
      >
        <div
          style="
            width: 240px;
            height: 240px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 8px;
          "
        >
          <img
            src="/assets/images/metgologo.png"
            alt="Metgo"
            style="
              width: 160px;
              animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            "
          />
        </div>
      </div>
      <style>
        @keyframes pulse {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.5;
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
